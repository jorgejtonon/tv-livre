<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Livre</title>
<meta name="description" content="TV ao vivo pela internet, grátis, para celular e computador.">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Conceito: sala de controle de TV — régua de canais numerados, luz "NO AR" e tipografia larga de vinheta. */
@font-face { font-family: "Archivo TV"; src: url("archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "TV Mono"; src: url("mono.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root {
  --ink: #0b0e14;        /* fundo */
  --panel: #131822;      /* superfícies */
  --panel-2: #1b2230;
  --line: #273043;
  --text: #e9edf3;
  --muted: #8b95a8;
  --tally: #ff4438;      /* luz NO AR */
  --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --info: #8ab4ff;
  --display: "Archivo TV", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo TV", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "TV Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--body); font-size: 15px; line-height: 1.45; font-stretch: 100%;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- topo ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter-r) 10px var(--gutter-l);
  background: color-mix(in srgb, var(--ink) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); flex: none; }
.brand b { font-family: var(--display); font-stretch: 125%; font-weight: 850; font-size: 19px; letter-spacing: -0.01em; text-transform: uppercase; }
.tally { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
.tally i { width: 7px; height: 7px; border-radius: 50%; background: #3a4357; }
.tally.on { color: var(--text); border-color: color-mix(in srgb, var(--tally) 55%, var(--line)); }
.tally.on i { background: var(--tally); box-shadow: 0 0 10px var(--tally); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.search { flex: 1; min-width: 0; position: relative; max-width: 420px; margin-left: auto; }
.search input { width: 100%; height: 38px; border-radius: 19px; border: 1px solid var(--line); background: var(--panel); padding: 0 14px 0 38px; outline: none; }
.search input:focus { border-color: var(--muted); }
.search svg { position: absolute; left: 12px; top: 9px; color: var(--muted); }
.icon-btn { height: 38px; min-width: 38px; border-radius: 19px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; flex: none; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn .lbl { font-weight: 600; font-size: 14px; }
@media (max-width: 640px) { .icon-btn .lbl { display: none; } .icon-btn { padding: 0; } .tally { display: none; } }

/* ---------- home ---------- */
main { padding: 18px var(--gutter-r) calc(40px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); max-width: 1480px; margin: 0 auto; display: grid; gap: 30px; }
.resume { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); }
.resume p { margin: 0; flex: 1; min-width: 0; color: var(--muted); font-size: 14px; }
.resume p strong { color: var(--text); }
.btn { height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); padding: 0 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--text); color: var(--ink); border-color: var(--text); }
.btn.primary:hover { background: #fff; }
.btn.danger { color: var(--bad); }
.section-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 12px; }
.section-h h2 { margin: 0; font-family: var(--display); font-stretch: 112%; font-weight: 780; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; }
.section-h span { color: var(--muted); font-size: 13px; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; }
.row > * { scroll-snap-align: start; }
@media (min-width: 900px) { .row { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); overflow: visible; } }
@media (max-width: 899px) { .row { grid-auto-columns: 46%; } }
#sections { display: grid; gap: 30px; }
.row .tile { aspect-ratio: auto; min-height: 128px; }
.featured { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 760px) { .featured { grid-template-columns: 1fr; } }

.tile {
  --h: 210;
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  aspect-ratio: 16 / 10; max-width: 100%; min-width: 0; padding: 12px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, hsl(var(--h) 60% 50%) 30%, var(--line));
  background:
    radial-gradient(120% 90% at 100% 0%, hsl(var(--h) 75% 42% / .55), transparent 60%),
    linear-gradient(160deg, hsl(var(--h) 45% 20%), hsl(var(--h) 35% 10%));
  text-align: left; color: var(--text); overflow: hidden; transition: transform .15s ease, border-color .15s ease;
}
.tile:hover { transform: translateY(-2px); border-color: hsl(var(--h) 70% 60% / .7); }
.tile:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.tile .num { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: hsl(var(--h) 30% 85% / .8); display: flex; justify-content: space-between; align-items: center; }
.tile .name { font-family: var(--display); font-stretch: 125%; font-weight: 860; text-transform: uppercase; letter-spacing: -0.02em; line-height: .95; font-size: clamp(19px, 2.1vw, 26px); overflow-wrap: anywhere; }
.tile .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tile .tag { color: hsl(var(--h) 25% 85% / .85); font-size: 12.5px; line-height: 1.3; }
.featured .tile { aspect-ratio: auto; min-height: 168px; padding: 16px; }
.featured .tile .name { font-size: clamp(34px, 4.6vw, 54px); }
@media (max-width: 760px) { .featured .tile { min-height: 0; padding: 14px; gap: 8px; } .featured .tile .name { font-size: 36px; } }
.fav-star { color: var(--warn); font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; background: rgb(0 0 0 / .35); border: 1px solid rgb(255 255 255 / .08); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.chip.ok i { background: var(--ok); } .chip.down i { background: var(--bad); } .chip.ext i { background: var(--info); } .chip.test i { background: var(--warn); animation: pulse 1s infinite; }
.chip.plain { background: transparent; border-color: rgb(255 255 255 / .14); font-weight: 500; }

.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); }
footer.note { color: var(--muted); font-size: 13px; line-height: 1.55; border-top: 1px solid var(--line); padding-top: 18px; max-width: 75ch; }
footer.note strong { color: var(--text); }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 50; background: #000; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: 100%; }
@media (max-width: 999px) {
  .player { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: start; overflow-y: auto; overscroll-behavior: contain; background: var(--panel); }
  .player > .stage-wrap { position: sticky; top: 0; z-index: 8; min-height: auto; }
}
.stage-wrap { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #000; padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 1000px) { .stage-wrap { height: 100%; } }
.stage { position: relative; flex: 1; min-height: 0; background: #000; display: grid; place-items: center; overflow: hidden; touch-action: pan-y; }
@media (max-width: 999px) { .stage { flex: none; aspect-ratio: 16 / 9; width: 100%; } }
.stage video, .stage .yt { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
.stage video { object-fit: contain; }
.stage .yt iframe { width: 100%; height: 100%; border: 0; display: block; }
.player:fullscreen .stage, .player.fs .stage { aspect-ratio: auto; }
.player:fullscreen, .player.fs { grid-template-columns: 1fr; grid-template-rows: 100%; }
.player:fullscreen .side, .player.fs .side { display: none; }
.player:fullscreen .stage-wrap, .player.fs .stage-wrap { height: 100%; }
.player:fullscreen .stage, .player.fs .stage { flex: 1; }

.osd { position: absolute; top: 12px; left: 12px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: rgb(0 0 0 / .62); backdrop-filter: blur(6px); pointer-events: none; transition: opacity .35s ease; }
.osd .n { font-family: var(--mono); font-size: 22px; color: #fff; }
.osd .t { font-family: var(--display); font-stretch: 118%; font-weight: 820; font-size: 18px; text-transform: uppercase; }
.osd .s { display: block; font-family: var(--body); font-stretch: 100%; font-weight: 500; font-size: 12px; text-transform: none; color: #c9d0dc; }
.osd.hide { opacity: 0; }
.digits { position: absolute; top: 12px; right: 12px; z-index: 5; font-family: var(--mono); font-size: 34px; color: #fff; background: rgb(0 0 0 / .65); padding: 4px 12px; border-radius: 8px; letter-spacing: .1em; }

.overlay { position: absolute; inset: 0; z-index: 3; display: grid; place-items: safe center; overflow-y: auto; padding: 18px; text-align: center; background: radial-gradient(80% 80% at 50% 40%, rgb(11 14 20 / .55), rgb(11 14 20 / .92)); }
.overlay .box { max-width: 520px; display: grid; gap: 12px; justify-items: center; }
.overlay h3 { margin: 0; font-family: var(--display); font-stretch: 115%; font-weight: 820; font-size: clamp(18px, 3vw, 24px); text-wrap: balance; }
.overlay p { margin: 0; color: #c3cad6; font-size: 14px; text-wrap: pretty; }
.overlay .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.overlay details { font-size: 13px; color: #c3cad6; text-align: left; max-width: 100%; }
.overlay details summary { cursor: pointer; text-align: center; color: var(--muted); }
.overlay details ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
@media (max-width: 999px) {
  .overlay { padding: 12px; }
  .overlay .box { gap: 8px; }
  .overlay h3 { font-size: 17px; }
  .overlay p { font-size: 13px; }
  .overlay .btn { height: 34px; padding: 0 10px; font-size: 13px; }
  .overlay .long { display: none; }
}
.spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgb(255 255 255 / .18); border-top-color: var(--tally); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.overlay.loading { background: rgb(0 0 0 / .45); }
#ov-loading-text { white-space: pre-line; }
.unmute { position: absolute; z-index: 6; left: 50%; bottom: 76px; transform: translateX(-50%); }

.bar { position: relative; z-index: 6; display: flex; align-items: center; gap: 6px; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, #0d1118, #090c12); border-top: 1px solid #1d2432; flex-wrap: wrap; }
.player:fullscreen .bar, .player.fs .bar { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, rgb(0 0 0 / .85), transparent); border: 0; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); transition: opacity .3s; }
.player.idle:fullscreen .bar, .player.idle.fs .bar { opacity: 0; pointer-events: none; }
.player.idle .osd { opacity: 0; }
.ctl { width: 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; color: #e7ebf2; display: inline-flex; align-items: center; justify-content: center; }
.ctl:hover { background: rgb(255 255 255 / .08); }
.ctl.on { color: var(--warn); }
.ctl svg.i { width: 22px; height: 22px; }
.bar .grow { flex: 1; min-width: 4px; }
.vol { width: 96px; accent-color: var(--text); }
@media (max-width: 520px) {
  .vol, #c-back, #c-fav, .bar .live-pill { display: none; }
  .bar { gap: 2px; flex-wrap: nowrap; }
  .ctl { width: 38px; }
  .src-btn { padding: 0 10px; }
  .src-btn svg { display: none; }
}
@media (min-width: 521px) { #c-fav2 { display: none; } }
.src-btn { height: 34px; border-radius: 17px; border: 1px solid #2a3346; background: #121722; padding: 0 12px; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; max-width: 220px; }
.src-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-pill { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: #fff; background: var(--tally); border-radius: 4px; padding: 3px 7px; }
.live-pill.off { background: #2a3346; color: var(--muted); }

.side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
@media (max-width: 999px) { .side { border-left: 0; min-height: auto; } }
.side-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.side-head .ttl { flex: 1; min-width: 0; }
.side-head .ttl b { display: block; font-family: var(--display); font-stretch: 118%; font-weight: 830; text-transform: uppercase; font-size: 18px; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-head .ttl small { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 10px 10px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tally); }
.list { overflow-y: auto; flex: 1; min-height: 0; padding: 6px; }
@media (max-width: 999px) { .list { overflow: visible; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); } }
.li { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.li:hover { background: var(--panel-2); }
.li.cur { background: color-mix(in srgb, var(--tally) 14%, var(--panel-2)); }
.li .n { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: center; }
.li .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4357; }
.li .dot.ok { background: var(--ok); } .li .dot.down { background: var(--bad); } .li .dot.ext { background: var(--info); } .li .dot.test { background: var(--warn); }
.src-note { padding: 10px 12px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.origin { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

/* ---------- folhas (diagnóstico, importar, sobre) ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 80; background: rgb(0 0 0 / .6); display: grid; place-items: end center; }
@media (min-width: 760px) { .sheet-bg { place-items: center; } }
.sheet { width: min(720px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 760px) { .sheet { border-radius: 14px; } }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet header h2 { margin: 0; flex: 1; font-family: var(--display); font-stretch: 115%; font-weight: 820; font-size: 18px; }
.sheet .body { overflow-y: auto; padding: 14px 16px 18px; display: grid; gap: 14px; }
.sheet p { margin: 0; color: #c3cad6; font-size: 14px; max-width: 70ch; }
.progress { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--tally); transition: width .25s ease; }
.diag { display: grid; gap: 6px; }
.diag details { border: 1px solid var(--line); border-radius: 8px; background: var(--ink); }
.diag summary { list-style: none; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; cursor: pointer; }
.diag summary::-webkit-details-marker { display: none; }
.diag summary .n { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.diag ul { margin: 0; padding: 0 10px 10px 50px; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.diag li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; color: #c3cad6; }
.diag li .dot { margin-top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #3a4357; }
.diag li .dot.ok { background: var(--ok); } .diag li .dot.down { background: var(--bad); } .diag li .dot.test { background: var(--warn); }
.diag li em { font-style: normal; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 13px; }
.field input[type=url], .field textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--ink); border-radius: 8px; padding: 10px 12px; color: var(--text); }
.field textarea { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 12px; }
.hstack { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--text); }
.menu { position: absolute; right: var(--gutter-r); top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 30; min-width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 18px 40px rgb(0 0 0 / .45); }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 10px; border: 0; background: transparent; border-radius: 8px; text-align: left; font-weight: 500; }
.menu button:hover { background: var(--panel-2); }
.toast { position: fixed; z-index: 120; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--ink); font-weight: 600; padding: 10px 16px; border-radius: 10px; max-width: min(92vw, 520px); box-shadow: 0 10px 30px rgb(0 0 0 / .4); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>

  <symbol id="i-hd" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7.5 9v6M7.5 12h3.5M11 9v6M14 9v6h1.5a3 3 0 0 0 0-6z"/></symbol>

<header class="top">
  <a class="brand" href="#" id="home-link" aria-label="TV Livre, início">
    <b>TV Livre</b>
    <span class="tally" id="tally"><i></i>NO AR</span>
  </a>
  <div class="search">
    <svg class="i"><use href="#i-search"/></svg>
    <label class="sr" for="q">Buscar canal</label>
    <input id="q" type="search" placeholder="Buscar canal ou número" autocomplete="off" enterkeyhint="search">
  </div>
  <button class="icon-btn" id="btn-diag" type="button" title="Testar todos os canais neste aparelho"><svg class="i"><use href="#i-pulse"/></svg><span class="lbl">Verificar canais</span></button>
  <button class="icon-btn" id="btn-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Mais opções"><svg class="i"><use href="#i-more"/></svg></button>
</header>
<div class="menu" id="menu" hidden role="menu">
  <button type="button" role="menuitem" data-act="update"><svg class="i"><use href="#i-refresh"/></svg>Atualizar fontes agora</button>
  <button type="button" role="menuitem" data-act="import"><svg class="i"><use href="#i-upload"/></svg>Importar lista M3U</button>
  <button type="button" role="menuitem" data-act="install" id="menu-install" hidden><svg class="i"><use href="#i-hd"/></svg>Instalar como aplicativo</button>
  <button type="button" role="menuitem" data-act="about"><svg class="i"><use href="#i-info"/></svg>Como funciona e atalhos</button>
</div>

<main id="home" tabindex="-1">
  <div class="resume" id="resume" hidden></div>
  <section id="search-results" hidden></section>
  <div id="sections"></div>
  <footer class="note" id="foot"></footer>
</main>

<div class="player" id="player" hidden aria-label="Player de TV">
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <video id="video" playsinline webkit-playsinline preload="auto" aria-label="Vídeo ao vivo"></video>
      <div class="yt" id="yt" hidden></div>
      <div class="overlay loading" id="ov-loading" hidden><div class="box"><div class="spinner" aria-hidden="true"></div><p id="ov-loading-text">Conectando…</p></div></div>
      <div class="overlay" id="ov-msg" hidden><div class="box" id="ov-msg-box"></div></div>
      <div class="osd" id="osd"><span class="n" id="osd-n">01</span><span class="t" id="osd-t">Canal<span class="s" id="osd-s"></span></span></div>
      <div class="digits" id="digits" hidden></div>
      <button class="btn primary unmute" id="unmute" type="button" hidden><svg class="i"><use href="#i-vol"/></svg>Ativar som</button>
    </div>
    <div class="bar" id="bar">
      <button class="ctl" id="c-back" type="button" aria-label="Voltar ao catálogo"><svg class="i"><use href="#i-back"/></svg></button>
      <button class="ctl" id="c-prev" type="button" aria-label="Canal anterior"><svg class="i"><use href="#i-down"/></svg></button>
      <button class="ctl" id="c-next" type="button" aria-label="Próximo canal"><svg class="i"><use href="#i-up"/></svg></button>
      <button class="ctl" id="c-play" type="button" aria-label="Pausar"><svg class="i"><use href="#i-pause"/></svg></button>
      <button class="ctl" id="c-mute" type="button" aria-label="Silenciar"><svg class="i"><use href="#i-vol"/></svg></button>
      <label class="sr" for="c-vol">Volume</label>
      <input class="vol" id="c-vol" type="range" min="0" max="1" step="0.05" value="1">
      <span class="live-pill off" id="c-live">AO VIVO</span>
      <span class="grow"></span>
      <button class="src-btn" id="c-src" type="button" title="Trocar de fonte"><svg class="i"><use href="#i-src"/></svg><span id="c-src-t">Fonte</span></button>
      <button class="ctl" id="c-q" type="button" aria-label="Qualidade" hidden><svg class="i"><use href="#i-hd"/></svg></button>
      <button class="ctl" id="c-fav" type="button" aria-label="Favoritar"><svg class="i"><use href="#i-star"/></svg></button>
      <button class="ctl" id="c-pip" type="button" aria-label="Janela flutuante" hidden><svg class="i"><use href="#i-pip"/></svg></button>
      <button class="ctl" id="c-fs" type="button" aria-label="Tela cheia"><svg class="i"><use href="#i-full"/></svg></button>
    </div>
  </div>
  <aside class="side" id="side">
    <div class="side-head">
      <div class="ttl"><b id="side-name">Canal</b><small id="side-sub"></small></div>
      <button class="ctl" id="c-fav2" type="button" aria-label="Favoritar"><svg class="i"><use href="#i-star"/></svg></button>
      <button class="ctl" id="c-close" type="button" aria-label="Fechar player"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-ch" aria-selected="true">Canais</button>
      <button type="button" role="tab" id="tab-src" aria-selected="false">Fontes deste canal</button>
    </div>
    <div class="list" id="side-list"></div>
  </aside>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title">Título</h2><button class="ctl" id="sheet-close" type="button" aria-label="Fechar"><svg class="i"><use href="#i-close"/></svg></button></header>
    <div class="body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="channels.js"></script>
<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
